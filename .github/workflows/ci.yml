name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite (excludes brutal/ — see brutal job)
        run: |
          python -m pytest tests/ -q \
            -m "not integration" \
            --ignore=tests/brutal \
            --ignore=tests/test_brain_coverage.py \
            --ignore=tests/test_brain_coverage_gap.py \
            --tb=short

      - name: Boot smoke test
        run: |
          python -m elengenix --help || elengenix --help || true

  brutal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run brutal suite (expensive/fuzz-style, deterministic)
        run: |
          python -m pytest tests/brutal -q --tb=short
